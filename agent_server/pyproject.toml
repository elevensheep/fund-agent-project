[project]
name = "a2a-server"
version = "0.1.0"
description = "Remote Sub-Agents Server powered by LangGraph and Google ADK to_a2a"
readme = "README.md"
authors = [
    { name = "elevensheep", email = "fttc100@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=1.1.2",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "duckduckgo-search>=6.0.0",
    "fastapi[standard]>=0.141.1",
    "google-adk>=2.6.3",
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-anthropic>=1.5.5",
    "langchain-google-genai>=4.3.3",
    "langchain-openai>=1.4.3",
    "langgraph>=1.2.11",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pydantic-settings>=2.15.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "shared-core",
    "sqlalchemy[asyncio]>=2.0.0",
    "sse-starlette>=2.0.0",
    "structlog>=26.1.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
    "redis>=5.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "core*", "workers*"]

[tool.uv]
package = true

[tool.uv.sources]
shared-core = { path = "../shared_core" }

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
