[project]
name = "a2a-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "elevensheep", email = "fttc100@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=1.1.2",
    "fastapi[standard]>=0.141.1",
    "google-adk>=2.6.3",
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-anthropic>=1.5.5",
    "langchain-google-genai>=4.3.3",
    "langchain-openai>=1.4.3",
    "langgraph>=1.2.11",
    "pydantic-settings>=2.15.0",
    "shared-core",
    "sse-starlette>=2.0.0",
    "structlog>=26.1.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "core*"]

[tool.uv]
package = true

[tool.uv.sources]
shared-core = { path = "../shared_core" }

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
