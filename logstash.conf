input {
  # Docker syslog 드라이버를 통해 로그를 수신합니다 (TCP 5000)
  tcp {
    port => 5000
    codec => json
  }
  udp {
    port => 5000
    codec => json
  }
}

filter {
  # structlog JSON 포맷 파싱
  if [message] =~ /^{.*}$/ {
    json {
      source => "message"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "agent-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
