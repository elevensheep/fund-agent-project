name: agent_monitoring

services:
  # ─── PLG Stack (Log Aggregation) ───
  loki:
    image: grafana/loki:3.0.0
    container_name: agent_loki
    restart: unless-stopped
    ports:
      - "23100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - agent_net

  promtail:
    image: grafana/promtail:3.0.0
    container_name: agent_promtail
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - agent_net

  grafana:
    image: grafana/grafana:latest
    container_name: agent_grafana
    restart: unless-stopped
    ports:
      - "23000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - loki
      - prometheus
    networks:
      - agent_net

  prometheus:
    image: prom/prometheus:latest
    container_name: agent_prometheus
    restart: unless-stopped
    ports:
      - "29090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - agent_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: agent_cadvisor
    restart: unless-stopped
    ports:
      - "28080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - agent_net
    privileged: true

networks:
  agent_net:
    external: true
    name: agent_shared_net

volumes:
  grafana_data:
    name: agent_grafana_data
  prometheus_data:
    name: agent_prometheus_data
